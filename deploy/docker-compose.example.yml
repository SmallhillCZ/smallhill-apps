name: smallhill-apps

networks:
  admin_traefik:
    external: true
  db:

services:
  smallhill-apps:
    image: ghcr.io/smallhillcz/smallhill-apps:latest
    container_name: smallhill-apps
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://smallhill-apps:${DB_PASSWORD}@smallhill-apps.db:5432/smallhill-apps
    depends_on:
      db:
        condition: service_healthy
    networks:
      - admin_traefik
      - db
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.smallhill-apps.rule: Host(`${APPS_HOST:-apps.smallhill.cz}`)

  db:
    image: postgres:17-alpine
    container_name: smallhill-apps.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smallhill-apps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: smallhill-apps
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smallhill-apps"]
      interval: 5s
      retries: 10
    networks:
      - db
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.cooldown-delay: 7d
