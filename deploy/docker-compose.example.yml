name: smallhill-apps

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=smallhill-apps
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG:-/root/.docker}/config.json:/config.json:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.watchtower.rule: Host(`${APPS_HOST:-apps.smallhill.cz}`) && Path(`/v1/update`)
      traefik.http.services.watchtower.loadbalancer.server.port: "8080"

  portal:
    image: ghcr.io/smallhillcz/smallhill-apps-portal:latest
    restart: unless-stopped

  scheduler:
    image: ghcr.io/smallhillcz/smallhill-apps-scheduler:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scheduler:${SCHEDULER_DB_PASSWORD}@scheduler-db:5432/scheduler
    depends_on:
      scheduler-db:
        condition: service_healthy

  scheduler-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${SCHEDULER_DB_PASSWORD}
      POSTGRES_DB: scheduler
    volumes:
      - scheduler-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scheduler"]
      interval: 5s
      retries: 10

volumes:
  letsencrypt:
  scheduler-db:

networks:
  default:
    name: smallhill-apps
