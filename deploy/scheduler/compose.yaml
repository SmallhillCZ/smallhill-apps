name: scheduler

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scheduler
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scheduler"]
      interval: 5s
      retries: 10
    networks:
      - internal

  app:
    image: ghcr.io/smallhillcz/smallhill-apps-scheduler:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD}@db:5432/scheduler
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - smallhill-apps

volumes:
  db:

networks:
  internal:
  smallhill-apps:
    external: true
