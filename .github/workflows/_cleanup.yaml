name: Clean up untagged images

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Name of the container package to clean up"
        type: string
        required: true
        default: smallhill-apps-tuner
  workflow_call:
    inputs:
      package:
        description: "Name of the container package to clean up"
        type: string
        required: true

jobs:
  cleanup:
    name: Delete untagged image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_PATH: ${{ github.event.repository.owner.type == 'User' && 'users' || 'orgs' }}/${{ github.repository_owner }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Delete untagged image versions
        run: |
          base="/$OWNER_PATH/packages/container/$PACKAGE/versions"
          ids=$(gh api --paginate "$base?per_page=100" --jq '.[] | select(.metadata.container.tags | length == 0) | .id')
          echo "Deleting $(echo -n "$ids" | grep -c . || true) untagged versions"
          failed=0
          for id in $ids; do
            if ! out=$(gh api --method DELETE "$base/$id" --silent 2>&1); then
              if grep -q "HTTP 404" <<< "$out"; then
                echo "Version $id already gone"
              else
                echo "::warning::Deleting version $id failed: $out"
                failed=$((failed + 1))
              fi
            fi
            sleep 1
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed versions could not be deleted"
            exit 1
          fi
