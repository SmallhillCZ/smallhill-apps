name: Scheduler

on:
  pull_request:
    paths:
      - apps/scheduler/**
      - .github/workflows/scheduler.yml
  push:
    branches: [master]
    paths:
      - apps/scheduler/**
      - .github/workflows/scheduler.yml

defaults:
  run:
    working-directory: apps/scheduler

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/scheduler/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
