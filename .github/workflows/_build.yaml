name: Build

on:
  workflow_call:
    inputs:
      app:
        description: "App directory name in apps/"
        type: string
        required: true
      image:
        description: "Image reference to build and push"
        type: string
        required: true
      target:
        description: "Dockerfile stage to build"
        type: string
        required: false
      version:
        description: "Version to use for the built Docker images"
        type: string
        required: false
      base_path:
        description: "URL path the app is served under, defaults to /<app>/"
        type: string
        required: false
      bundle:
        description: "Bundle every app without its own Dockerfile into this image"
        type: boolean
        required: false
        default: false
      host:
        description: "Host the app is served on, used in the Traefik router rule"
        type: string
        required: true
      router:
        description: "Unique Traefik router name for this app and environment"
        type: string
        required: true

jobs:
  build:
    name: Build and publish ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the updated source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Dockerfile
        id: dockerfile
        env:
          APP: ${{ inputs.app }}
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          dir="apps/$APP"
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::App $APP not found in apps/"
            exit 1
          fi
          file="$dir/Dockerfile"
          if [ ! -f "$file" ]; then
            echo "::error::$file not found"
            exit 1
          fi
          context="$dir"
          base_path="${BASE_PATH:-/$APP/}"
          base_path="/${base_path#/}"
          base_path="${base_path%/}/"
          port=$(awk 'toupper($1) == "EXPOSE" { print $2 }' "$file" | tail -n1)
          node_version=$(cat "$dir/.nvmrc" 2>/dev/null || echo 24)
          {
            echo "file=$file"
            echo "context=$context"
            echo "base_path=$base_path"
            echo "port=${port:-80}"
            echo "node_version=$node_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: inputs.bundle
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.dockerfile.outputs.node_version }}

      - name: Bundle apps
        id: bundle
        if: inputs.bundle
        env:
          APP: ${{ inputs.app }}
          BASE_PATH: ${{ steps.dockerfile.outputs.base_path }}
        run: |
          out="$RUNNER_TEMP/bundle"
          mkdir -p "$out/html"
          for dir in apps/*/; do
            name=$(basename "$dir")
            if [ "$name" = "$APP" ]; then
              base="$BASE_PATH"
            elif [ -f "$dir/Dockerfile" ] || [ ! -f "$dir/angular.json" ]; then
              continue
            else
              base="/$name/"
            fi
            echo "::group::$name at $base"
            (cd "$dir" && npm ci && npx ng build --base-href "$base")
            mkdir -p "$out/html$base"
            cp -r "$dir"dist/*/browser/. "$out/html$base"
            echo "::endgroup::"
            echo "- \`$name\` at \`$base\`" >> "$GITHUB_STEP_SUMMARY"
          done
          cp -r "apps/$APP/docker/." "$out/"
          echo "context=$out" >> "$GITHUB_OUTPUT"

      - name: Resolve Traefik labels
        id: labels
        env:
          HOST: ${{ inputs.host }}
          ROUTER: ${{ inputs.router }}
          BASE_PATH: ${{ steps.dockerfile.outputs.base_path }}
          PORT: ${{ steps.dockerfile.outputs.port }}
        run: |
          prefix="${BASE_PATH%/}"
          {
            echo "labels<<EOF"
            echo "traefik.enable=true"
            echo "com.centurylinklabs.watchtower.enable=true"
            echo "traefik.http.services.$ROUTER.loadbalancer.server.port=$PORT"
            echo "traefik.http.routers.$ROUTER.service=$ROUTER"
            echo "traefik.http.routers.$ROUTER.tls=true"
            if [ -z "$prefix" ]; then
              echo "traefik.http.routers.$ROUTER.rule=Host(\`$HOST\`)"
            else
              echo "traefik.http.routers.$ROUTER.rule=Host(\`$HOST\`) && (Path(\`$prefix\`) || PathPrefix(\`$prefix/\`))"
              echo "traefik.http.routers.$ROUTER.middlewares=$ROUTER-slash"
              echo "traefik.http.middlewares.$ROUTER-slash.redirectregex.regex=^(https?://[^/]+$prefix)\$"
              echo "traefik.http.middlewares.$ROUTER-slash.redirectregex.replacement=\${1}/"
              echo "traefik.http.middlewares.$ROUTER-slash.redirectregex.permanent=true"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.bundle.outputs.context || steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.file }}
          target: ${{ inputs.target }}
          tags: ${{ inputs.image }}
          push: true
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            BASE_PATH=${{ steps.dockerfile.outputs.base_path }}
            NODE_VERSION=${{ steps.dockerfile.outputs.node_version }}
          provenance: false
