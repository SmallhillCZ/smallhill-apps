name: Build

on:
  workflow_call:
    inputs:
      image:
        description: "Image reference to build and push"
        type: string
        required: true
      version:
        description: "Version to use for the built Docker images"
        type: string
        required: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the updated source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: docker/.nvmrc

      - name: Bundle apps
        id: bundle
        run: |
          out="$RUNNER_TEMP/bundle"
          mkdir -p "$out/html" "$out/servers"
          : > "$out/servers.list"
          : > "$out/servers.conf"
          port=3001
          echo "| App | Path | Kind |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for dir in apps/*/; do
            dir="${dir%/}"
            name=$(basename "$dir")
            [ -f "$dir/package.json" ] || continue
            if [ "$name" = "portal" ]; then
              base="/"
            else
              base="/$name/"
            fi
            serve=$(cd "$dir" && npm pkg get scripts.serve)
            echo "::group::$name at $base"
            (cd "$dir" && npm ci && npx ng build --base-href "$base")
            if [ "$serve" = "{}" ]; then
              mkdir -p "$out/html$base"
              cp -r "$dir"/dist/*/browser/. "$out/html$base"
              kind=static
            else
              (cd "$dir" && npm prune --omit=dev)
              mkdir -p "$out/servers/$name"
              cp -r "$dir"/. "$out/servers/$name/"
              rm -rf "$out/servers/$name/.angular" "$out/servers/$name/src" "$out/servers/$name/test"
              echo "$name $port" >> "$out/servers.list"
              {
                echo "location = /$name { return 301 /$name/; }"
                echo "location ^~ /$name/ {"
                echo "  proxy_pass http://127.0.0.1:$port;"
                echo "  proxy_set_header Host \$host;"
                echo "  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;"
                echo "  proxy_set_header X-Forwarded-Proto \$http_x_forwarded_proto;"
                echo "}"
              } >> "$out/servers.conf"
              kind="server on port $port"
              port=$((port + 1))
            fi
            echo "::endgroup::"
            echo "| $name | \`$base\` | $kind |" >> "$GITHUB_STEP_SUMMARY"
          done
          cp -r docker/. "$out/"
          echo "context=$out" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.bundle.outputs.context }}
          tags: ${{ inputs.image }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VERSION=${{ inputs.version }}
          provenance: false
