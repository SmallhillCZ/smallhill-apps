name: Android Player

on:
  pull_request:
    paths:
      - "android/player/**"
      - ".github/workflows/android.player.yaml"
  push:
    branches:
      - master
    paths:
      - "android/player/**"
      - ".github/workflows/android.player.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/player
    steps:
      - name: Checkout the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: player-debug-apk
          path: android/player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
