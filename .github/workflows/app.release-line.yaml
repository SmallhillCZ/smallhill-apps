name: Release Line

on:
  pull_request:
    paths:
      - "apps/release-line/**"
      - ".github/workflows/app.release-line.yaml"
  push:
    branches:
      - master
    paths:
      - "apps/release-line/**"
      - ".github/workflows/app.release-line.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/_test.yaml
    with:
      app: release-line
