name: Tuner

on:
  pull_request:
    paths:
      - "apps/tuner/**"
      - ".github/workflows/app.tuner.yaml"
  push:
    branches:
      - master
    paths:
      - "apps/tuner/**"
      - ".github/workflows/app.tuner.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: release-dev
        options:
          - release-dev
          - release-production
          - bump-version
      semver:
        description: "Version bump (production release and bump version)"
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.action || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_test.yaml
    with:
      app: tuner
      postgres: false

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'bump-version'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_release.yaml
    with:
      app: tuner
      environment: ${{ inputs.action == 'release-production' && 'production' || 'dev' }}
      semver: ${{ inputs.semver }}
    secrets: inherit

  version:
    name: Resolve version
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'bump-version'
    uses: ./.github/workflows/_version.yaml
    with:
      app: tuner
      semver: ${{ inputs.semver }}

  tag:
    name: Tag
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/_tag.yaml
    with:
      tag: tuner-PRODUCTION
      version: ${{ needs.version.outputs.version }}
