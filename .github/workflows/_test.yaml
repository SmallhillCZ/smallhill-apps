name: Test

on:
  workflow_call:
    inputs:
      app:
        description: "App directory name in apps/"
        type: string
        required: true
      postgres:
        description: "Start a PostgreSQL service for the tests"
        type: boolean
        required: false
        default: false

jobs:
  test:
    name: Test ${{ inputs.app }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ inputs.postgres && 'postgres://test:test@localhost:5432/test' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check app exists
        id: app
        working-directory: .
        env:
          APP: ${{ inputs.app }}
        run: |
          if [ -f "apps/$APP/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/$APP does not exist on this ref, skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.app.outputs.exists == 'true'
        name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/${{ inputs.app }}/.nvmrc
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - if: steps.app.outputs.exists == 'true'
        name: Install dependencies
        run: npm ci

      - if: steps.app.outputs.exists == 'true'
        name: Check formatting
        run: npm run format:check --if-present

      - if: steps.app.outputs.exists == 'true'
        name: Build
        run: npm run build --if-present

      - if: steps.app.outputs.exists == 'true'
        name: Test
        run: npm test --if-present
