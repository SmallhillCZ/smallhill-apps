<div class="app-container" [class.dark-mode]="isDarkMode()">
  <app-toolbar
    [canUndo]="canUndo"
    [canRedo]="canRedo"
    [hasHeader]="hasHeader()"
    [delimiter]="delimiter()"
    [filename]="filename()"
    [hasData]="hasData"
    [theme]="theme()"
    (openFile)="openFile()"
    (saveFile)="saveFile($event)"
    (undo)="undo()"
    (redo)="redo()"
    (hasHeaderChange)="hasHeader.set($event)"
    (delimiterChange)="delimiter.set($event)"
    (themeChange)="setTheme($event)"
    (transformNumber)="openNumberTransform()"
    (transformDate)="openDateTransform()"
    (transformMarkup)="openMarkupTransform()"
    (showFormula)="openFormula()"
  ></app-toolbar>

  <main class="main-content">
    @if (!hasData) {
      <div
        class="empty-state"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.drag-over]="isDragOver()"
      >
        <div class="empty-icon">📊</div>
        <h2>{{ t().title }}</h2>
        <p>{{ t().emptyText }}</p>
        <button nz-button nzType="primary" nzSize="large" (click)="openFile()">
          {{ t().openCsvFile }}
        </button>
      </div>
    } @else {
      <app-grid
        [data]="data()"
        [hasHeader]="hasHeader()"
        (dataChange)="onDataChange($event)"
        (selectionChange)="onSelectionChange($event)"
        (fileDrop)="loadFile($event)"
      ></app-grid>
    }
  </main>

  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    accept=".csv,.tsv,.txt"
    style="display: none"
    (change)="onFileSelected($event)"
  />
</div>
