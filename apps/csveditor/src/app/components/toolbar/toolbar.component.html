<div class="toolbar">
  <div class="toolbar-brand">
    <span class="brand-name">{{ t().title }}</span>
    @if (filename()) {
      <span class="filename">{{ filename() }}</span>
    }
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- File operations -->
  <div class="toolbar-group">
    <button
      nz-button
      nzType="default"
      nz-tooltip
      [nzTooltipTitle]="t().openTooltip"
      (click)="onOpenFile()"
    >
      <span nz-icon nzType="folder-open" nzTheme="outline"></span>
      {{ t().open }}
    </button>
    <button
      nz-button
      nzType="default"
      nz-tooltip
      [nzTooltipTitle]="t().saveTooltip"
      [disabled]="!hasData()"
      (click)="onSaveFile()"
    >
      <span nz-icon nzType="save" nzTheme="outline"></span>
      {{ t().save }}
    </button>
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- Undo/Redo -->
  <div class="toolbar-group">
    <button
      nz-button
      nzType="text"
      nz-tooltip
      [nzTooltipTitle]="t().undo"
      [disabled]="!canUndo()"
      (click)="onUndo()"
    >
      <span nz-icon nzType="undo" nzTheme="outline"></span>
    </button>
    <button
      nz-button
      nzType="text"
      nz-tooltip
      [nzTooltipTitle]="t().redo"
      [disabled]="!canRedo()"
      (click)="onRedo()"
    >
      <span nz-icon nzType="redo" nzTheme="outline"></span>
    </button>
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- CSV Settings -->
  <div class="toolbar-group">
    <label class="toolbar-label">{{ t().delimiter }}</label>
    <nz-select
      [ngModel]="delimiter()"
      (ngModelChange)="onDelimiterChange($event)"
      nzSize="small"
      style="width: 120px"
    >
      @for (opt of delimiterOptions(); track opt.value) {
        <nz-option [nzValue]="opt.value" [nzLabel]="opt.label"></nz-option>
      }
    </nz-select>

    <label class="toolbar-label">{{ t().headerRow }}</label>
    <nz-switch
      [ngModel]="hasHeader()"
      (ngModelChange)="onHasHeaderChange($event)"
      nzSize="small"
    ></nz-switch>
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- Transform tools -->
  <div class="toolbar-group">
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      [nzTooltipTitle]="t().numbersTooltip"
      (click)="transformNumber.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="number" nzTheme="outline"></span>
      {{ t().numbers }}
    </button>
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      [nzTooltipTitle]="t().datesTooltip"
      (click)="transformDate.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="calendar" nzTheme="outline"></span>
      {{ t().dates }}
    </button>
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      nzTooltipTitle="HTML ↔ Markdown"
      (click)="transformMarkup.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="code" nzTheme="outline"></span>
      {{ t().markup }}
    </button>
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      [nzTooltipTitle]="t().formulaTooltip"
      (click)="showFormula.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="function" nzTheme="outline"></span>
      {{ t().formula }}
    </button>
  </div>

  <div class="toolbar-spacer"></div>

  <div class="toolbar-group langs" role="group" [attr.aria-label]="t().language">
    @for (l of langs; track l) {
      <button
        nz-button
        nzType="text"
        nzSize="small"
        [class.active]="lang() === l"
        [attr.aria-pressed]="lang() === l"
        [attr.lang]="l"
        (click)="setLang(l)"
      >
        {{ l.toUpperCase() }}
      </button>
    }
  </div>

  <!-- Dark mode toggle -->
  <div class="toolbar-group">
    <span nz-icon [nzType]="darkMode() ? 'moon' : 'sun'" nzTheme="outline"></span>
    <nz-switch
      [ngModel]="darkMode()"
      [attr.aria-label]="t().darkMode"
      (ngModelChange)="onDarkModeChange($event)"
      nzSize="small"
    ></nz-switch>
  </div>
</div>
