<div class="toolbar">
  <div class="toolbar-brand">
    <span class="brand-name">{{ t().title }}</span>
    @if (filename()) {
      <span class="filename">{{ filename() }}</span>
    }
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- File operations -->
  <div class="toolbar-group">
    <button
      nz-button
      nzType="default"
      nz-tooltip
      [nzTooltipTitle]="t().openTooltip"
      (click)="onOpenFile()"
    >
      <span nz-icon nzType="folder-open" nzTheme="outline"></span>
      {{ t().open }}
    </button>
    <button
      nz-button
      nzType="default"
      nz-tooltip
      [nzTooltipTitle]="t().saveTooltip"
      [disabled]="!hasData()"
      (click)="onSaveFile()"
    >
      <span nz-icon nzType="save" nzTheme="outline"></span>
      {{ t().save }}
    </button>
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- Undo/Redo -->
  <div class="toolbar-group">
    <button
      nz-button
      nzType="text"
      nz-tooltip
      [nzTooltipTitle]="t().undo"
      [disabled]="!canUndo()"
      (click)="onUndo()"
    >
      <span nz-icon nzType="undo" nzTheme="outline"></span>
    </button>
    <button
      nz-button
      nzType="text"
      nz-tooltip
      [nzTooltipTitle]="t().redo"
      [disabled]="!canRedo()"
      (click)="onRedo()"
    >
      <span nz-icon nzType="redo" nzTheme="outline"></span>
    </button>
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- CSV Settings -->
  <div class="toolbar-group">
    <label class="toolbar-label">{{ t().delimiter }}</label>
    <nz-select
      [ngModel]="delimiter()"
      (ngModelChange)="onDelimiterChange($event)"
      nzSize="small"
      style="width: 120px"
    >
      @for (opt of delimiterOptions(); track opt.value) {
        <nz-option [nzValue]="opt.value" [nzLabel]="opt.label"></nz-option>
      }
    </nz-select>

    <label class="toolbar-label">{{ t().headerRow }}</label>
    <nz-switch
      [ngModel]="hasHeader()"
      (ngModelChange)="onHasHeaderChange($event)"
      nzSize="small"
    ></nz-switch>
  </div>

  <nz-divider nzType="vertical"></nz-divider>

  <!-- Transform tools -->
  <div class="toolbar-group">
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      [nzTooltipTitle]="t().numbersTooltip"
      (click)="transformNumber.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="number" nzTheme="outline"></span>
      {{ t().numbers }}
    </button>
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      [nzTooltipTitle]="t().datesTooltip"
      (click)="transformDate.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="calendar" nzTheme="outline"></span>
      {{ t().dates }}
    </button>
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      nzTooltipTitle="HTML ↔ Markdown"
      (click)="transformMarkup.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="code" nzTheme="outline"></span>
      {{ t().markup }}
    </button>
    <button
      nz-button
      nzType="default"
      nzSize="small"
      nz-tooltip
      [nzTooltipTitle]="t().formulaTooltip"
      (click)="showFormula.emit()"
      [disabled]="!hasData()"
    >
      <span nz-icon nzType="function" nzTheme="outline"></span>
      {{ t().formula }}
    </button>
  </div>

  <div class="toolbar-spacer"></div>

  <button
    type="button"
    class="more"
    nz-button
    nzType="text"
    popovertarget="menu"
    [attr.aria-label]="t().menu"
    [title]="t().menu"
  >
    <svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="5" r="2" />
      <circle cx="12" cy="12" r="2" />
      <circle cx="12" cy="19" r="2" />
    </svg>
  </button>
  <div id="menu" class="menu" popover>
    <div class="menu-row">
      <span>{{ t().language }}</span>
      <div class="langs" role="group" [attr.aria-label]="t().language">
        @for (l of langs; track l) {
          <button
            type="button"
            [class.selected]="lang() === l"
            [attr.aria-pressed]="lang() === l"
            [attr.lang]="l"
            (click)="setLang(l)"
          >
            {{ l.toUpperCase() }}
          </button>
        }
      </div>
    </div>
    <div class="menu-row">
      <span>{{ t().theme }}</span>
      <select
        class="theme"
        [attr.aria-label]="t().theme"
        [value]="theme()"
        (change)="onThemeChange($any($event.target).value)"
      >
        @for (option of themes; track option) {
          <option [value]="option" [selected]="option === theme()">{{ t().themes[option] }}</option>
        }
      </select>
    </div>
  </div>
</div>
