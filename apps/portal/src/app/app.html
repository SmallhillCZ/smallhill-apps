<header class="hero">
	<img src="favicon.svg" alt="" width="48" height="48" />
	<div>
		<h1>{{ t().title }}</h1>
		<p>{{ t().subtitle }}</p>
	</div>
	<div class="lang" role="group" [attr.aria-label]="t().language">
		@for (option of langs; track option) {
			<button
				type="button"
				[attr.aria-pressed]="lang() === option"
				[attr.lang]="option"
				(click)="setLang(option)"
			>
				{{ option.toUpperCase() }}
			</button>
		}
	</div>
</header>

<main>
	<ul class="grid">
		@for (app of apps; track app.id) {
			<li><app-tile [app]="app" (details)="open(app.id)" /></li>
		}
	</ul>
</main>

<footer>{{ t().footer }}</footer>

<dialog #dialog (close)="selected() && close()" (click)="onBackdropClick($event)">
	@if (selected(); as app) {
		<app-detail [app]="app" (closed)="close()" />
	}
</dialog>
